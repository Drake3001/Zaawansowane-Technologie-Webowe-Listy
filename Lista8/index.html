<!DOCTYPE html>
<html>
  <head>
    <title>Socket.IO chat</title>
    <style>
      :root {
        --bg: #f3f6fa;
        --panel: #ffffff;
        --ink: #1b2430;
        --accent: #15616d;
        --muted: #5e6b78;
        --warn: #b00020;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        background: radial-gradient(circle at top right, #d3f3ee 0%, var(--bg) 40%, #dfe7f4 100%);
        color: var(--ink);
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      .shell {
        max-width: 860px;
        margin: 0 auto;
        padding: 24px 16px 32px;
      }

      .card {
        background: var(--panel);
        border-radius: 16px;
        box-shadow: 0 14px 40px rgba(0, 0, 0, 0.08);
        padding: 20px;
      }

      h1, h2 {
        margin: 0 0 14px;
      }

      .row {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
      }

      input, select, button {
        font-size: 16px;
      }

      input, select {
        border: 1px solid #c4d0dc;
        border-radius: 10px;
        padding: 10px 12px;
      }

      button {
        border: 0;
        border-radius: 10px;
        background: var(--accent);
        color: #fff;
        padding: 10px 14px;
        cursor: pointer;
      }

      button.secondary {
        background: #637083;
      }

      #status {
        color: var(--muted);
        margin-bottom: 10px;
      }

      #error {
        min-height: 22px;
        color: var(--warn);
        font-weight: 600;
        margin-top: 12px;
      }

      #messages {
        list-style: none;
        margin: 0;
        padding: 0;
        border: 1px solid #d5deea;
        border-radius: 12px;
        background: #fff;
        height: 420px;
        overflow-y: auto;
      }

      #messages li {
        border-bottom: 1px solid #edf2f7;
      }

      #messages li:last-child {
        border-bottom: 0;
      }

      .message-row {
        display: flex;
        padding: 10px 12px;
      }

      .message-row.other {
        justify-content: flex-start;
      }

      .message-row.self {
        justify-content: flex-end;
      }

      .bubble {
        max-width: min(82%, 560px);
        border-radius: 18px;
        padding: 10px 12px;
        box-shadow: 0 8px 18px rgba(10, 20, 30, 0.08);
        border: 1px solid transparent;
      }

      .message-row.other .bubble {
        background: #eef6ff;
        border-top-left-radius: 6px;
        border-color: #d7e5f7;
      }

      .message-row.self .bubble {
        background: linear-gradient(180deg, #15616d 0%, #0f4f57 100%);
        color: #fff;
        border-top-right-radius: 6px;
        border-color: #0f4f57;
      }

      .bubble-meta {
        display: flex;
        gap: 10px;
        align-items: baseline;
        justify-content: space-between;
        font-size: 12px;
        opacity: 0.8;
        margin-bottom: 6px;
      }

      .bubble-nick {
        font-weight: 700;
      }

      .bubble-time {
        white-space: nowrap;
      }

      .bubble-text {
        white-space: pre-wrap;
        word-break: break-word;
        line-height: 1.4;
      }

      #messages li.system {
        color: var(--muted);
        font-style: italic;
        background: #f8fbfd;
      }

      #typingIndicator {
        min-height: 24px;
        margin: 8px 2px 0;
        color: var(--muted);
        font-style: italic;
      }

      #chatForm {
        margin-top: 12px;
      }

      #chatInput {
        flex: 1;
        min-width: 220px;
      }

      .hidden {
        display: none;
      }

      @media (max-width: 700px) {
        #messages {
          height: 360px;
        }

        .row {
          flex-direction: column;
          align-items: stretch;
        }

        button,
        input,
        select {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <h1>Socket Chat</h1>

      <section id="lobby" class="card">
        <h2>Join Room</h2>
        <div class="row">
          <input id="nickInput" maxlength="20" placeholder="Choose your nick" autocomplete="off" />
          <select id="roomSelect"></select>
          <button id="joinBtn" type="button">Join</button>
        </div>
        <div id="error"></div>
      </section>

      <section id="chat" class="card hidden">
        <div id="status"></div>
        <ul id="messages"></ul>
        <div id="typingIndicator"></div>
        <form id="chatForm" action="">
          <div class="row">
            <input id="chatInput" autocomplete="off" maxlength="300" placeholder="Write a message" />
            <button type="submit">Send</button>
            <button id="leaveBtn" type="button" class="secondary">Leave room</button>
          </div>
        </form>
      </section>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
      var socket = io();

      var nick = '';
      var currentRoom = '';
      var availableRooms = [];

      var lobby = document.getElementById('lobby');
      var chat = document.getElementById('chat');
      var status = document.getElementById('status');
      var typingIndicator = document.getElementById('typingIndicator');
      var error = document.getElementById('error');
      var nickInput = document.getElementById('nickInput');
      var roomSelect = document.getElementById('roomSelect');
      var joinBtn = document.getElementById('joinBtn');
      var leaveBtn = document.getElementById('leaveBtn');
      var messages = document.getElementById('messages');
      var chatForm = document.getElementById('chatForm');
      var chatInput = document.getElementById('chatInput');
      var typingUsers = new Set();
      var typingEmitTimer = null;
      var typingIsActive = false;

      function setError(message) {
        error.textContent = message || '';
      }

      function renderRoomOptions() {
        roomSelect.innerHTML = '';
        for (var i = 0; i < availableRooms.length; i += 1) {
          var option = document.createElement('option');
          option.value = availableRooms[i];
          option.textContent = availableRooms[i];
          roomSelect.appendChild(option);
        }
      }

      function appendChatMessage(data) {
        var isSelf = data.nick === nick;
        var item = document.createElement('li');
        var bubble = document.createElement('div');
        var meta = document.createElement('div');
        var nickLabel = document.createElement('span');
        var timeLabel = document.createElement('span');
        var text = document.createElement('div');
        var timestamp = data.createdAt ? new Date(data.createdAt) : new Date();

        item.className = 'message-row ' + (isSelf ? 'self' : 'other');
        bubble.className = 'bubble';
        meta.className = 'bubble-meta';
        nickLabel.className = 'bubble-nick';
        timeLabel.className = 'bubble-time';
        text.className = 'bubble-text';

        nickLabel.textContent = data.nick;
        timeLabel.textContent = timestamp.toLocaleString();
        text.textContent = data.text;

        meta.appendChild(nickLabel);
        meta.appendChild(timeLabel);
        bubble.appendChild(meta);
        bubble.appendChild(text);
        item.appendChild(bubble);
        messages.appendChild(item);
        messages.scrollTop = messages.scrollHeight;
      }

      function appendSystemMessage(text) {
        var item = document.createElement('li');
        item.className = 'system';
        item.textContent = text;
        messages.appendChild(item);
        messages.scrollTop = messages.scrollHeight;
      }

      function setTypingIndicator() {
        var users = Array.from(typingUsers).filter(function(user) {
          return user !== nick;
        });

        if (!users.length) {
          typingIndicator.textContent = '';
          return;
        }

        if (users.length === 1) {
          typingIndicator.textContent = users[0] + ' is typing...';
          return;
        }

        typingIndicator.textContent = users.slice(0, -1).join(', ') + ' and ' + users[users.length - 1] + ' are typing...';
      }

      function stopTyping() {
        if (typingEmitTimer) {
          clearTimeout(typingEmitTimer);
          typingEmitTimer = null;
        }

        if (typingIsActive) {
          typingIsActive = false;
          socket.emit('typing_state', false);
        }
      }

      function notifyTyping() {
        if (!currentRoom) {
          return;
        }

        if (!typingIsActive) {
          typingIsActive = true;
          socket.emit('typing_state', true);
        }

        if (typingEmitTimer) {
          clearTimeout(typingEmitTimer);
        }

        typingEmitTimer = setTimeout(function() {
          stopTyping();
        }, 1200);
      }

      function renderHistory(history) {
        messages.innerHTML = '';
        for (var i = 0; i < history.length; i += 1) {
          appendChatMessage(history[i]);
        }
      }

      function showLobby() {
        currentRoom = '';
        status.textContent = '';
        typingUsers.clear();
        typingIndicator.textContent = '';
        stopTyping();
        lobby.classList.remove('hidden');
        chat.classList.add('hidden');
      }

      function showChat(room, history) {
        currentRoom = room;
        status.textContent = 'Nick: ' + nick + ' | Room: ' + currentRoom;
        typingUsers.clear();
        typingIndicator.textContent = '';
        stopTyping();
        lobby.classList.add('hidden');
        chat.classList.remove('hidden');
        renderHistory(history || []);
        chatInput.focus();
      }

      joinBtn.addEventListener('click', function() {
        var desiredNick = nickInput.value.trim();
        var desiredRoom = roomSelect.value;

        if (!desiredNick) {
          setError('Nick is required.');
          return;
        }

        if (!desiredRoom) {
          setError('Choose a room.');
          return;
        }

        socket.emit('set_nick', desiredNick, function(nickResult) {
          if (!nickResult || !nickResult.ok) {
            setError((nickResult && nickResult.message) || 'Cannot set nick.');
            return;
          }

          nick = nickResult.nick;

          socket.emit('join_room', desiredRoom, function(roomResult) {
            if (!roomResult || !roomResult.ok) {
              setError((roomResult && roomResult.message) || 'Cannot join room.');
              return;
            }

            setError('');
            showChat(roomResult.room, roomResult.history || []);
          });
        });
      });

      leaveBtn.addEventListener('click', function() {
        socket.emit('leave_room', function(result) {
          if (!result || !result.ok) {
            setError('Could not leave the room.');
            return;
          }

          showLobby();
        });
      });

      chatForm.addEventListener('submit', function(e) {
        e.preventDefault();

        var text = chatInput.value.trim();
        if (!text) {
          return;
        }

        socket.emit('chat_message', text, function(result) {
          if (!result || !result.ok) {
            setError((result && result.message) || 'Message failed to send.');
            return;
          }

          setError('');
          chatInput.value = '';
          stopTyping();
          chatInput.focus();
        });
      });

      chatInput.addEventListener('input', function() {
        if (!chatInput.value.trim()) {
          stopTyping();
          return;
        }

        notifyTyping();
      });

      chatInput.addEventListener('blur', function() {
        stopTyping();
      });

      socket.on('rooms_list', function(rooms) {
        availableRooms = Array.isArray(rooms) ? rooms : [];
        renderRoomOptions();
      });

      socket.on('chat_message', function(payload) {
        appendChatMessage(payload);
      });

      socket.on('system_message', function(message) {
        appendSystemMessage(message);
      });

      socket.on('typing_state', function(payload) {
        if (!payload || payload.room !== currentRoom) {
          return;
        }

        typingUsers = new Set(Array.isArray(payload.users) ? payload.users : []);
        setTypingIndicator();
      });

      socket.on('error_message', function(message) {
        setError(message);
      });
    </script>
  </body>
</html>
